name: Shell Quality

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Bash syntax
        run: |
          bash -n debian-bookworm-to-trixie.sh
          bash -n tests/test-source-migration.sh
          bash -n tests/test-preflight-policy.sh
          bash -n tests/test-container-upgrade.sh
          bash -n tests/test-rollback.sh
      - name: ShellCheck
        run: |
          shellcheck debian-bookworm-to-trixie.sh tests/test-container-upgrade.sh
          shellcheck -e SC1091,SC2034 tests/test-source-migration.sh tests/test-preflight-policy.sh tests/test-rollback.sh
      - name: Source migration fixtures
        run: bash tests/test-source-migration.sh
      - name: Release preflight policy fixtures
        run: bash tests/test-preflight-policy.sh
      - name: Help surface smoke test
        run: bash debian-bookworm-to-trixie.sh --help | grep -q -- '--dry-run'

  rollback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prove source rollback in disposable Bookworm container
        run: |
          docker pull debian:12
          docker run --rm \
            --volume "$PWD:/workspace:ro" \
            debian:12 \
            bash /workspace/tests/test-rollback.sh

  bookworm-to-trixie-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Upgrade disposable Debian 12 container to Debian 13
        run: bash tests/test-container-upgrade.sh
