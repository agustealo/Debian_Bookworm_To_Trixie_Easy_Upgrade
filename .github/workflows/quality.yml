name: Shell Quality

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Bash syntax
        run: |
          bash -n debian-bookworm-to-trixie.sh
          bash -n tests/test-source-migration.sh
      - name: ShellCheck
        run: shellcheck debian-bookworm-to-trixie.sh tests/test-source-migration.sh
      - name: Source migration fixtures
        run: bash tests/test-source-migration.sh
      - name: Help surface smoke test
        run: bash debian-bookworm-to-trixie.sh --help | grep -q -- '--dry-run'
